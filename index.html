<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <!-- Solo file propri, e in rete solo l'API di GitHub. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; connect-src 'self' https://api.github.com; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#14202b">
  <title>Portafoglio</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main>
    <h1>Portafoglio</h1>
    <p id="messaggio" role="status" hidden></p>

    <section id="vista-dati" hidden>
      <p id="vecchi" class="avviso" hidden>Dati non aggiornati da più di 5 ore.</p>
      <div class="riepilogo">
        <p class="tenue">Controvalore</p>
        <p id="valore" class="grande"></p>
        <p id="pl" class="riga-pl"></p>
        <p id="aggiornato" class="tenue"></p>
        <p id="prezzati" class="tenue"></p>
      </div>
      <ul id="elenco" class="schede"></ul>
      <button type="button" id="cambia" class="secondario">Impostazioni</button>
    </section>

    <section id="vista-setup" hidden>
      <div id="notifiche" class="blocco" hidden>
        <h2>Notifiche</h2>
        <p id="notifiche-stato" role="status"></p>
        <button type="button" id="notifiche-attiva" hidden></button>
      </div>
      <form id="form-setup" autocomplete="off">
        <h2 id="titolo-accesso" hidden>Accesso</h2>
        <label for="campo-repo">Repository dei dati</label>
        <input id="campo-repo" type="text" placeholder="utente/repository"
               autocapitalize="none" autocorrect="off" spellcheck="false" required>
        <label for="campo-token">Token</label>
        <input id="campo-token" type="password" autocomplete="off"
               autocapitalize="none" autocorrect="off" spellcheck="false" required>
        <button type="submit">Collega</button>
        <button type="button" id="annulla" class="secondario" hidden>Indietro</button>
        <button type="button" id="rimuovi" class="secondario" hidden>Rimuovi accesso e copia locale</button>
      </form>
    </section>
  </main>

  <dialog id="pannello" aria-labelledby="pannello-nome">
    <form id="form-soglie" autocomplete="off" novalidate>
      <h2 id="pannello-nome"></h2>
      <p id="pannello-ora" class="tenue"></p>
      <label class="interruttore">
        <span>Notifica</span>
        <input id="soglia-attiva" type="checkbox" role="switch">
      </label>
      <label for="soglia-su">Avvisami al rialzo, sul prezzo di carico</label>
      <div class="soglia">
        <span class="su">+</span>
        <input id="soglia-su" type="text" inputmode="decimal" placeholder="nessuna">
        <span>%</span>
      </div>
      <label for="soglia-giu">Avvisami al ribasso, sul prezzo di carico</label>
      <div class="soglia">
        <span class="giu">−</span>
        <input id="soglia-giu" type="text" inputmode="decimal" placeholder="nessuna">
        <span>%</span>
      </div>
      <p id="pannello-nota" class="tenue" hidden>Senza soglie non arriverà nessuna notifica.</p>
      <p id="pannello-esito" role="status"></p>
      <button type="submit" id="pannello-salva">Salva</button>
      <button type="button" id="pannello-chiudi" class="secondario">Chiudi</button>
    </form>
  </dialog>
  <script type="module" src="js/main.js"></script>
</body>
</html>
